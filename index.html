<style>
/* Layout: sticky top bar (ראשי / מחירים / השוואה), card grid with search and filters, detail sheet on click, price rows with period switch, sort and day calculator, side-by-side compare table */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5c6b78;
  --line: #dbe1e7;
  --accent: #0b7a75;
  --accent-soft: #d9efed;
  --accent-fg: #ffffff;
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171e; --surface: #17222b; --fg: #e8eef3; --muted: #93a3b1;
    --line: #28363f; --accent: #3fc3bb; --accent-soft: #123a38; --accent-fg: #06201f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171e; --surface: #17222b; --fg: #e8eef3; --muted: #93a3b1;
  --line: #28363f; --accent: #3fc3bb; --accent-soft: #123a38; --accent-fg: #06201f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 1040px; margin-inline: auto; display: flex; align-items: center; gap: 8px 24px; min-height: 56px; flex-wrap: wrap; padding-block: 4px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

.theme { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero { padding-block: 36px 8px; }
.hero h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 700; }
.hero p { color: var(--muted); max-width: 60ch; margin: 10px 0 0; }

.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; min-width: 0; }
.field.grow { flex: 1 1 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 15px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.empty { color: var(--muted); margin-top: 24px; }
.card { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card .maker { font-size: 14px; color: var(--muted); }
.card h3 { font-size: 20px; }
.card .tag { font-size: 15px; color: var(--muted); }
.card .cost { margin-top: auto; padding-top: 10px; font-family: var(--font-display); font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }

.detail { margin-top: 18px; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 22px; }
.detail-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.detail h2 { font-size: 26px; }
.close { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 16px; }
.cols h3 { font-size: 16px; color: var(--accent); margin-bottom: 6px; }
.cols ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.go { display: inline-block; margin-top: 18px; margin-inline-end: 8px; background: var(--accent); color: var(--accent-fg); padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 0; }
.go.alt { background: var(--accent-soft); color: var(--accent); }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 8px 18px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.days { width: 90px; font-variant-numeric: tabular-nums; }
.rows { margin-top: 18px; display: grid; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; }
.row b { font-family: var(--font-display); font-size: 18px; }
.row .p { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; text-align: end; }
.row .sub { color: var(--muted); font-size: 15px; }
.row .unit { color: var(--muted); font-size: 14px; text-align: end; }
.note { margin-top: 20px; color: var(--muted); font-size: 15px; max-width: 72ch; }
.stamp { display: inline-block; margin-top: 14px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 4px 12px; font-size: 15px; font-weight: 600; }

.tbl { margin-top: 18px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; }
.tbl th, .tbl td { text-align: start; vertical-align: top; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); font-weight: 600; width: 140px; }
.tbl thead th, .tbl thead td { font-family: var(--font-display); font-size: 19px; color: var(--accent); }
.tbl ul { margin: 0; padding-inline-start: 18px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

    '<div class="tools"><div class="seg" role="group" aria-label="תקופה">' + seg + '</div>' + customBox +
    '<label class="field">מיון <select id="sort"><option value="default">לפי הרשימה</option><option value="asc">מהזול ליקר</option><option value="desc">מהיקר לזול</option></select></label></div>' +
    '<div class="rows" id="rows"></div>' +
    '<p class="note">המחיר החודשי הוא מחיר המנוי הרשמי. החברות האלה לא מוכרות מנוי ליום או לשבוע, ולכן המחיר ליום, לשבוע ולמספר ימים מחושב מהמחיר החודשי. אתרים צד שלישי שמוכרים גישה ליום או לשבוע גובים מחיר אחר ואין להם קשר לחברות. מחיר שנתי רשמי קיים ב-Claude Pro, ב-Google AI Pro, ב-Microsoft 365 Premium, ב-Perplexity Pro וב-Midjourney Basic. בשאר המודלים הוא מחושב כ-12 חודשים. מחירי ChatGPT לא הוצגו בעמוד הרשמי בזמן הבדיקה ולכן נלקחו מאתר השוואה. ב-DeepSeek, ב-Meta AI וב-Qwen השימוש הבסיסי חינמי. ב-ElevenLabs החודש הראשון עולה $1 ואחריו $6 לחודש, והמחירים כאן הם של החבילה הזולה ביותר בכל שירות.</p>' +
    '<p class="note">האתר עדיין לא מתעדכן אוטומטית. כדי להפוך אותו למערכת מסחרית, השלב הבא הוא לחבר מנגנון שבודק את עמודי המחירים מדי פעם ומעדכן אותם. עד אז כדאי לבדוק באתר הרשמי לפני קנייה.</p>';
}
function renderRows() {
  var P = PERIODS[period];
  var list = MODELS.slice();
  if (sortMode !== "default") list.sort(function (a, b) { return (price(a, period) - price(b, period)) * (sortMode === "asc" ? 1 : -1); });
  document.getElementById("sort").value = sortMode;
  document.getElementById("rows").innerHTML = list.map(function (m) {
    var deal = (period === "year" && m.year) ? " · מחיר מנוי שנתי" : "";
    var unit = !m.month ? "" : period === "custom" ? "ל-" + daysVal + " ימים" : P.unit;
    return '<div class="row"><b>' + esc(m.name) + '</b><span class="p">' + money(price(m, period)) + '</span>' +
      '<span class="sub">' + esc(m.maker) + ' · ' + esc(m.tag) + deal + '</span><span class="unit">' + unit + '</span></div>';
  }).join("");
}

/* compare */
function compare() {
  var opts = function (sel) {
    return MODELS.map(function (m) { return '<option value="' + m.id + '"' + (m.id === sel ? " selected" : "") + '>' + esc(m.name) + '</option>'; }).join("");
  };
  return '<section class="hero"><h1>השוואה בין שני מודלים</h1><p>בחרו שני מודלים כדי לראות אותם זה לצד זה.</p></section>' +
    '<div class="tools"><label class="field">מודל ראשון <select id="cmpA">' + opts(cmpA) + '</select></label>' +
    '<label class="field">מודל שני <select id="cmpB">' + opts(cmpB) + '</select></label></div>' +
    '<div class="tbl" id="cmpTable"></div>';
}
function renderCompare() {
  var a = byId(cmpA), b = byId(cmpB);
  var li = function (arr) { return "<ul>" + arr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; };
  var yr = function (m) { return m.month ? money(m.year || m.month * 12) + (m.year ? "" : " (מחושב)") : "חינם"; };
  var row = function (h, f) { return "<tr><th>" + h + "</th><td>" + f(a) + "</td><td>" + f(b) + "</td></tr>"; };
  document.getElementById("cmpTable").innerHTML = "<table><thead><tr><th></th><td>" + esc(a.name) + "</td><td>" + esc(b.name) + "</td></tr></thead><tbody>" +
    row("יצרן", function (m) { return esc(m.maker); }) +
    row("מחיר לחודש", function (m) { return money(m.month); }) +
    row("מחיר לשנה", yr) +
    row("מתאים במיוחד ל", function (m) { return esc(m.tag); }) +
    row("במה הוא טוב", function (m) { return li(m.good); }) +
    row("פחות מתאים ל", function (m) { return li(m.less); }) + "</tbody></table>";
}

function render() {
  var h = location.hash.replace("#", "");
  var page = h === "prices" ? "prices" : h === "compare" ? "compare" : "home";
  ["home", "prices", "compare"].forEach(function (p) {
    document.getElementById("nav-" + p).setAttribute("aria-current", p === page ? "page" : "false");
  });
  if (page === "home") { app.innerHTML = home(); renderGrid(); renderDetail(); }
  else if (page === "prices") { app.innerHTML = prices(); renderRows(); }
  else { app.innerHTML = compare(); renderCompare(); }
}

app.addEventListener("click", function (e) {
  var c = e.target.closest(".card"), s = e.target.closest("[data-p]"), f = e.target.closest("[data-f]"), cm = e.target.closest("[data-cmp]");
  if (c) {
    openId = openId === c.dataset.id ? null : c.dataset.id;
    renderGrid(); renderDetail();
    var d = document.getElementById("detail");
    if (d) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } else if (f) { filter = f.dataset.f; render(); }
  else if (s) { period = s.dataset.p; render(); }
  else if (cm) { cmpA = cm.dataset.cmp; cmpB = cmpA === "chatgpt" ? "claude" : "chatgpt"; location.hash = "#compare"; }
  else if (e.target.id === "close") { openId = null; renderGrid(); renderDetail(); }
});
app.addEventListener("input", function (e) {
  if (e.target.id === "q") { query = e.target.value; renderGrid(); }
  else if (e.target.id === "days") { daysVal = Math.max(1, Math.min(365, parseInt(e.target.value, 10) || 1)); renderRows(); }
});
app.addEventListener("change", function (e) {
  if (e.target.id === "sort") { sortMode = e.target.value; renderRows(); }
  else if (e.target.id === "cmpA") { cmpA = e.target.value; renderCompare(); }
  else if (e.target.id === "cmpB") { cmpB = e.target.value; renderCompare(); }
});
/* night / day switch */
var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>';
function isDark() {
  var t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function paintThemeButton() {
  document.getElementById("theme").innerHTML = isDark() ? SUN + "<span>מצב יום</span>" : MOON + "<span>מצב לילה</span>";
}
try { var saved = localStorage.getItem("ai-guide-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch (e) {}
document.getElementById("theme").addEventListener("click", function () {
  var next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("ai-guide-theme", next); } catch (e) {}
  paintThemeButton();
});
paintThemeButton();
window.addEventListener("hashchange", render);
render();
</script>

</body>
</html>
