var TK_MIN = 100000, TK_MAX = 10000000;
function tkFromT(t) { var v = TK_MIN * Math.pow(TK_MAX / TK_MIN, t / 1000); var step = v < 1e6 ? 10000 : 100000; return Math.round(v / step) * step; }
function tkToT(v) { v = Math.min(TK_MAX, Math.max(TK_MIN, v)); return Math.round(1000 * Math.log(v / TK_MIN) / Math.log(TK_MAX / TK_MIN)); }
function tkShort(v) { if (v >= 1e9) return +(v / 1e9).toFixed(2) + "B"; if (v >= 1e6) return +(v / 1e6).toFixed(2) + "M"; return Math.round(v / 1e3) + "K"; }

}

function bindTokens(root) {
  var range = root.querySelector("#tkRange"), text = root.querySelector("#tkText");
  root.querySelector("#tkShare").value = String(tk.share);
  root.querySelector("#tkPeak").checked = tk.peak;
  text.value = tk.tokens.toLocaleString("en-US");
  range.value = tkToT(tk.tokens);
  paintTokens(root);
  range.addEventListener("input", function () { tk.tokens = tkFromT(Number(range.value)); text.value = tk.tokens.toLocaleString("en-US"); text.removeAttribute("aria-invalid"); paintTokens(root); });
  text.addEventListener("input", function () {
    var n = tkParse(text.value);

  });

function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function paintTokens(root) {
  var t = tkToT(tk.tokens), p = t / 1000;
  var thumb = root.querySelector("#thumb");

  root.querySelector("#fill").style.width = (p * 100) + "%";

    return { m: m, ip: ip, op: op, ic: ic, oc: oc, total: ic + oc };
  }).sort(function (a, b) { return a.total - b.total; });

  root.querySelector("#tkRes").innerHTML = "<table><thead><tr><th>Model</th><th>Input / output per 1M</th><th>Input cost</th><th>Output cost</th><th>Total</th></tr></thead><tbody>" +
    rows.map(function (r) {
      return "<tr><td><b>" + esc(r.m.name) + "</b><br><span style='color:var(--muted);font-size:14px'>" + esc(r.m.vendor) + (r.m.note ? " · " + esc(r.m.note) : "") + "</span></td><td>$" + r.ip + " / $" + r.op + "</td><td>" + usd(r.ic) + "</td><td>" + usd(r.oc) + "</td><td class='total'>" + usd(r.total) + "<div class='bar2'><i style='width:" + Math.max(2, r.total / max * 100) + "%'></i></div></td></tr>";
    }).join("") + "</tbody></table>";
}
function usd(v) {
  if (v === 0) return "$0";
  if (v < 0.01) return "under $0.01";
  if (v >= 1000) return "$" + Math.round(v).toLocaleString("en-US");
  return "$" + v.toFixed(2);
}

var _orig = new WeakMap(), _busy = false, _mo = null;
function guessLang() {
  var n = ((navigator.language || "en") + "").slice(0, 2).toLowerCase();
  return LANGS.some(function (l) { return l[0] === n; }) ? n : "en";
}
function langInfo(c) { return LANGS.filter(function (l) { return l[0] === c; })[0] || LANGS[0]; }
function fillLangSelect(sel, cur) {
  sel.innerHTML = LANGS.map(function (l) { return '<option value="' + l[0] + '"' + (l[0] === cur ? " selected" : "") + ">" + l[1] + "</option>"; }).join("");
}
function trText(s) { var d = I18N[LANG]; return (d && d[s]) || s; }
function trNode(n) {
  if (n.nodeType === 3) {
    var raw = _orig.has(n) ? _orig.get(n) : n.nodeValue, t = raw.trim();
    if (!t) return;
    var out = trText(t);
    if (!_orig.has(n) && out === t) return;
    _orig.set(n, raw);
    var v = raw.replace(t, out);
    if (n.nodeValue !== v) n.nodeValue = v;
  } else if (n.nodeType === 1 && n.tagName !== "SCRIPT" && n.tagName !== "STYLE") {
    ["placeholder", "aria-label"].forEach(function (a) {
      if (!n.hasAttribute(a)) return;
      var k = "_o_" + a; if (!n[k]) n[k] = n.getAttribute(a);
      var o = trText(n[k]); if (n.getAttribute(a) !== o) n.setAttribute(a, o);
    });
    for (var c = n.firstChild; c; c = c.nextSibling) trNode(c);
  }
}
function applyLang() {
  var i = langInfo(LANG);
  document.documentElement.lang = i[0]; document.documentElement.dir = i[2];
  _busy = true; trNode(document.body); _busy = false;
  var ls = $("lang"); if (ls) ls.value = LANG;
}
function setLang(c) {
  LANG = c; save(LASTLANG_KEY, c);
  if (user) { user.lang = c; save(USER_KEY, user); rememberLang(user.email, c); }
  applyLang();
}
function rememberLang(email, c) {
  if (!email) return; var m = load(LANGS_KEY) || {}; m[email.toLowerCase()] = c; save(LANGS_KEY, m);
}
function recallLang(email) { var m = load(LANGS_KEY) || {}; return m[(email || "").trim().toLowerCase()] || null; }
function initLang() {
  fillLangSelect($("lang"), LANG);
  $("lang").addEventListener("change", function () { setLang($("lang").value); });
  _mo = new MutationObserver(function (list) {
    if (_busy || LANG === "en") return;
    _busy = true;
    list.forEach(function (m) { m.addedNodes.forEach(trNode); if (m.type === "characterData") trNode(m.target); });
    _busy = false;

  applyLang();
}

function showGate() {
  var g = document.createElement("div");
  g.className = "gate"; g.id = "gate";
  g.innerHTML = '<form class="box" id="gateForm"><h1>Sign in</h1><p>You need an account to use the site. It is stored only in this browser, with no password and no server.</p>' +

  $("gLang").addEventListener("change", function () { setLang($("gLang").value); });
  $("gMail").addEventListener("change", function () { var l = recallLang($("gMail").value); if (l) { $("gLang").value = l; setLang(l); } });
