<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מדריך מודלי AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Assistant:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar whose buttons open windows (button grows, window grows out of it); home = search + token button + model cards; floating FAQ bot */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --fg: #14202b; --muted: #5c6b78; --line: #dbe1e7;
  --accent: #0b7a75; --accent-soft: #d9efed; --accent-fg: #ffffff;
  --flame: #e8742c; --ad: #fff4d6; --ad-line: #e3c36a; --scrim: rgba(10, 20, 28, .55);
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171e; --surface: #17222b; --fg: #e8eef3; --muted: #93a3b1; --line: #28363f;
    --accent: #3fc3bb; --accent-soft: #123a38; --accent-fg: #06201f;
    --flame: #ff9a52; --ad: #2c2610; --ad-line: #6b5a20; --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171e; --surface: #17222b; --fg: #e8eef3; --muted: #93a3b1; --line: #28363f;
  --accent: #3fc3bb; --accent-soft: #123a38; --accent-fg: #06201f;
  --flame: #ff9a52; --ad: #2c2610; --ad-line: #6b5a20; --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 1040px; margin-inline: auto; display: flex; align-items: center; gap: 8px 14px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin-inline-end: 6px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.navbtn { background: none; border: 1px solid transparent; color: var(--muted); padding: 8px 14px; border-radius: 10px; font-weight: 600; transition: transform .28s cubic-bezier(.3,1.4,.5,1), background-color .2s, color .2s; }
.navbtn:hover { background: var(--bg); color: var(--fg); }
.navbtn.is-open { transform: scale(1.18); background: var(--accent); color: var(--accent-fg); position: relative; z-index: 2; }
.side { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; }
.pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.pro { background: var(--accent); color: var(--accent-fg); }

/* home */
.hero { padding-block: 34px 6px; }
.hero h1 { font-size: clamp(27px, 5.6vw, 42px); font-weight: 700; }
.hero p { color: var(--muted); max-width: 62ch; margin: 10px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; min-width: 0; }
.field.grow { flex: 1 1 200px; }
.tokbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 9px 16px; font-weight: 700; white-space: nowrap; transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
.tokbtn svg { width: 22px; height: 22px; }
.tokbtn.is-open { transform: scale(1.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 15px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
.empty { color: var(--muted); margin-top: 24px; }
.card { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.card .maker { font-size: 14px; color: var(--muted); }
.card h3 { font-size: 19px; }
.card .tag { font-size: 15px; color: var(--muted); }
.card .cost { margin-top: auto; padding-top: 10px; font-family: var(--font-display); font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.detail { margin-top: 18px; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 22px; }
.detail-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.detail h2 { font-size: 26px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 16px; }
.cols h3 { font-size: 16px; color: var(--accent); margin-bottom: 6px; }
.cols ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.btn { display: inline-block; background: var(--accent); color: var(--accent-fg); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; border: 0; margin-top: 16px; margin-inline-end: 8px; }
.btn.alt { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.ad { margin-top: 22px; background: var(--ad); border: 1px dashed var(--ad-line); border-radius: 10px; padding: 12px 16px; font-size: 15px; color: var(--muted); }

/* windows */
.overlay { position: fixed; inset: 0; z-index: 40; background: transparent; display: flex; justify-content: center; align-items: flex-start; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); transition: background-color .25s; overflow: auto; }
.overlay.in { background: var(--scrim); }
.panel { width: 100%; max-width: 880px; margin-top: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.28); opacity: 0; transform: scale(.15); transition: transform .38s cubic-bezier(.2,1.1,.3,1), opacity .2s; min-width: 0; }
.overlay.in .panel { opacity: 1; transform: scale(1); }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.phead h2 { font-size: 22px; }
.x { background: none; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 22px; line-height: 1; }
.pbody { padding: 20px 22px 26px; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 7px 16px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.row { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; }
.rows { display: grid; gap: 8px; margin-top: 14px; }
.row b { font-family: var(--font-display); font-size: 17px; }
.row .p { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; text-align: end; }
.row .sub { color: var(--muted); font-size: 15px; }
.row .unit { color: var(--muted); font-size: 14px; text-align: end; }
.note { margin-top: 16px; color: var(--muted); font-size: 15px; max-width: 72ch; }
.stamp { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 3px 12px; font-size: 14px; font-weight: 600; }
.days { width: 90px; font-variant-numeric: tabular-nums; }
.tbl { margin-top: 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 520px; }
.tbl th, .tbl td { text-align: start; vertical-align: top; padding: 11px 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl tr:last-child th, .tbl tr:last-child td { border-bottom: 0; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 15px; }
.tbl thead td, .tbl thead th { font-family: var(--font-display); color: var(--accent); font-size: 17px; }
.tbl ul { margin: 0; padding-inline-start: 18px; }
.tbl .total { color: var(--accent); font-weight: 700; font-family: var(--font-display); }
.form { display: grid; gap: 12px; max-width: 460px; }
.form label { display: grid; gap: 4px; font-weight: 600; }
.sk { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 20px; }
.cats { display: grid; gap: 6px; align-content: start; }
.cats button { text-align: start; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-weight: 600; }
.cats button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.skills { display: grid; gap: 10px; }
.skill { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 2px; }
.skill b { font-family: var(--font-display); }
.skill code, .code { direction: ltr; unicode-bidi: plaintext; }
.code { display: block; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; text-align: left; margin: 10px 0; }
details { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 10px; }
summary { font-weight: 600; cursor: pointer; }
details ol, details ul { padding-inline-start: 22px; display: grid; gap: 4px; margin: 10px 0 0; }
.yes { color: var(--accent); font-weight: 700; }
@media (max-width: 640px) { .sk { grid-template-columns: 1fr; } .cats { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); } }

/* token window */
.tk-in { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; margin-top: 18px; }
.tk-in label { display: grid; gap: 4px; font-weight: 600; min-width: 0; }
.tk-in input[type=text] { width: 200px; max-width: 100%; font-variant-numeric: tabular-nums; direction: ltr; text-align: center; font-size: 20px; font-family: var(--font-display); }
.rail { position: relative; margin: 34px 22px 0; direction: ltr; height: 56px; }
.track { position: absolute; inset: 0; border: 2px solid var(--fg); border-radius: 999px; background: var(--bg); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); width: 0; }
.stars { position: absolute; inset: 0; font-size: 11px; color: var(--muted); }
.stars i { position: absolute; font-style: normal; transform: translate(-50%, -50%); }
.rail input[type=range] { position: absolute; left: -18px; width: calc(100% + 36px); top: -10px; height: 76px; margin: 0; opacity: 0; z-index: 3; cursor: grab; }
.thumb { position: absolute; top: 50%; z-index: 2; pointer-events: none; transform: translate(-50%, -50%); }
.thumb svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ends { display: flex; justify-content: space-between; margin: 10px 22px 0; direction: ltr; font-weight: 700; font-family: var(--font-display); color: var(--muted); }
.bubble { position: relative; direction: ltr; height: 38px; margin: 4px 22px 0; }
.bubble span { position: absolute; top: 0; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 3px 14px; font-weight: 700; font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar2 { height: 8px; border-radius: 99px; background: var(--accent-soft); margin-top: 6px; overflow: hidden; }
.bar2 i { display: block; height: 100%; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .panel, .overlay, .navbtn, .tokbtn, .card { transition: none; } }

/* bot */
.botbtn { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; gap: 8px; align-items: center; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.botbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bot { position: fixed; z-index: 26; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 32px)); max-height: min(560px, 80vh); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,.3); overflow: hidden; }

.msgs { overflow: auto; padding: 12px 14px; display: grid; gap: 8px; align-content: start; flex: 1; min-height: 160px; }
.m { max-width: 88%; padding: 8px 12px; border-radius: 12px; background: var(--bg); white-space: pre-wrap; }
.m.me { justify-self: end; background: var(--accent); color: var(--accent-fg); }
.bot form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.bot form input { flex: 1; min-width: 0; }
.qs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
.qs button { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 14px; }

/* login */
.gate { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; justify-content: center; align-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.gate .box { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
.gate h1 { font-size: 26px; }
.gate p { color: var(--muted); }
</style>
</head>

    '<details><summary>Gemini</summary><ul><li>הדבר הקרוב הוא Gem: עוזר מותאם אישית עם הוראות קבועות.</li><li>יוצרים Gem חדש ומדביקים בו את ההוראות של הסקיל.</li></ul></details>' +
    '<details><summary>כתיבת סקיל טוב</summary><ul><li>התיאור קובע מתי הסקיל מופעל, ולכן כתבו בו מתי להשתמש בו ולא רק מה הוא עושה.</li><li>הוראות קצרות וממוספרות עובדות טוב יותר מפסקאות ארוכות.</li><li>דוגמה אחת של תוצר מוכן שווה יותר מתיאור כללי.</li></ul></details>';
}
function bindGuides(root) {
  root.addEventListener("click", function (e) { var b = e.target.closest("[data-copy-tpl]"); if (b) copyText(SKILL_TEMPLATE, b); });
}

/* ---------- upgrade ---------- */
function upgradeWin() {
  var rows = [
    ["חשבון ושמירת העדפות", "יש", "יש"],
    ["מחשבון טוקנים, מחירים והשוואה", "יש", "יש"],
    ["ספריית סקילים", "יש", "יש"],
    ["פרסומות", "יש", "אין"],
    ["שאלות לבוט בכל ביקור", "5", "ללא הגבלה"],
    ["סקילים מועדפים", "אין", "יש"],
    ["התראה במייל על מודל שמתאים לבקשה שלך", "אין", "בקרוב"]
  ];
  return '<div class="tbl"><table><thead><tr><th></th><td>חינם</td><td>Premium</td></tr></thead><tbody>' + rows.map(function (r) { return "<tr><th>" + r[0] + "</th><td>" + r[1] + "</td><td class='yes'>" + r[2] + "</td></tr>"; }).join("") + "</tbody></table></div>" +
    '<p class="note">מחיר מוצע: $3 לחודש. התשלום עדיין לא מחובר, ובגרסת ההדגמה השדרוג מופעל רק בדפדפן הזה. התראות מייל דורשות שרת, ולכן הן עדיין לא פעילות.</p>' +
    '<div id="upAct"></div>';
}
function bindUpgrade(root) { paintUpgrade(root); root.addEventListener("click", function (e) {
  var b = e.target.closest("[data-up]"); if (!b) return;
  user.premium = b.dataset.up === "on"; save(USER_KEY, user); paintBar(); paintUpgrade(root); renderHome();
}); }
function paintUpgrade(root) {
  root.querySelector("#upAct").innerHTML = isPro() ? '<span class="badge pro">Premium פעיל</span> <button class="btn ghost" type="button" data-up="off" style="margin-top:0">חזרה לחינם</button>' : '<button class="btn" type="button" data-up="on" style="margin-top:0">שדרוג (הדגמה)</button>';
}

/* ---------- account ---------- */
var USES = ["כתיבה", "קוד", "חיפוש", "תמונות", "Office", "קול ומוזיקה"];
function accountWin() {
  return '<div class="form"><div><b>' + esc(user.name) + '</b><div style="color:var(--muted)">' + esc(user.email) + ' <span class="badge' + (isPro() ? " pro" : "") + '">' + (isPro() ? "Premium" : "חינם") + '</span></div></div>' +
    '<label>במה אתם צריכים AI?<select class="field" id="aUse">' + USES.map(function (u) { return '<option value="' + u + '"' + (user.use === u ? " selected" : "") + ">" + u + "</option>"; }).join("") + '</select></label>' +
    '<label>תקציב חודשי בדולרים<input class="field" id="aBudget" type="number" min="0" max="1000" step="1" value="' + (user.budget == null ? 10 : user.budget) + '"></label>' +
    '<label style="font-weight:400"><span><input type="checkbox" disabled> עדכון במייל כשיש מודל שמתאים יותר (מחכה לשרת מיילים)</span></label></div>' +
    '<h3 style="margin-top:20px">מה מתאים לכם עכשיו</h3><div class="rows" id="recs"></div>' +
    '<p class="note">החשבון נשמר רק בדפדפן הזה. אין סיסמה ואין שרת, ולכן אף אחד אחר לא רואה את הפרטים. כשיתחבר שרת, אפשר יהיה לשמור חשבון בין מכשירים.</p>' +
    '<button class="btn ghost" type="button" id="logout" style="margin-top:6px">יציאה</button>';
}
function bindAccount(root) {
  paintRecs(root);
  root.addEventListener("input", function (e) {
    if (e.target.id === "aBudget") { var v = parseFloat(e.target.value); user.budget = isFinite(v) ? Math.max(0, v) : 0; }
    else return;
    save(USER_KEY, user); paintRecs(root);
  });
  root.addEventListener("change", function (e) { if (e.target.id === "aUse") { user.use = e.target.value; save(USER_KEY, user); paintRecs(root); } });
  root.querySelector("#logout").addEventListener("click", function () { closeWindow(true); user = null; try { localStorage.removeItem(USER_KEY); } catch (e) {} botOpen = false; paintBar(); renderBot(); showGate(); });
}
function paintRecs(root) {
  var use = user.use || "כתיבה", budget = user.budget == null ? 10 : user.budget;
  var fit = SUB.filter(function (m) { return m.cats.indexOf(use) > -1 && m.month <= budget; }).sort(function (a, b) { return b.month - a.month; }).slice(0, 3);
  var html;
  if (fit.length) html = fit.map(function (m) { return '<div class="row"><b>' + esc(m.name) + '</b><span class="p">' + money(m.month) + '</span><span class="sub">' + esc(m.tag) + "</span><span class=\"unit\">" + (m.month ? "לחודש" : "") + "</span></div>"; }).join("");
  else {
    var cheapest = SUB.filter(function (m) { return m.cats.indexOf(use) > -1; }).sort(function (a, b) { return a.month - b.month; })[0];
    html = '<p class="empty" style="margin:0">אין מנוי בתחום "' + esc(use) + '" עד $' + budget + '. הזול ביותר בתחום: ' + (cheapest ? esc(cheapest.name) + " ב-" + money(cheapest.month) + " לחודש" : "לא נמצא") + ".</p>";
  }
  root.querySelector("#recs").innerHTML = html;
}

/* ---------- FAQ bot (rule-based, runs in the browser) ---------- */
var BOT_RULES = [
  [/מחיר|עולה|כמה|עלות|דולר/, "המחירים נמצאים בחלון \"מחירים\": מנויים לפי יום, שבוע, חודש, שנה או מספר ימים, וטבלת API לפי טוקנים. לחישוב לפי כמות, לחצו על \"טוקנים\" ליד החיפוש."],
  [/טוקן|טוקנים|api|קלט|פלט/, "בכפתור \"טוקנים\" בוחרים כמות בין 100K ל-10M, או מקלידים מספר. האתר מחשב עלות לכל מודל לפי מחיר הקלט והפלט למיליון טוקנים. אפשר לשנות את חלוקת הקלט והפלט."],
  [/שדרג|שדרוג|פרימיום|premium|מנוי שלכם/, "ב-Premium אין פרסומות, אין הגבלה על שאלות לבוט ואפשר לשמור סקילים מועדפים. התשלום עדיין לא מחובר, ובגרסת ההדגמה השדרוג מופעל בדפדפן הזה בלבד."],
  [/סקיל|skill|סקילים/, "בחלון \"ספריית סקילים\" בוחרים תחום ורואים את הסקילים שמתאימים. בחלון \"מדריכים\" יש הסבר איך מוסיפים סקיל ל-Claude, ומה הקרוב לזה ב-ChatGPT וב-Gemini."],
  [/מייל|התראה|אימייל/, "התראות במייל דורשות שרת, ולכן הן עדיין לא פעילות. אפשר להגדיר תחום ותקציב בחשבון, והאתר יציג מיד מה מתאים."],
  [/חשבון|התחבר|כניסה|סיסמ|יציאה/, "החשבון נשמר רק בדפדפן הזה, בלי סיסמה ובלי שרת. כדי להחליף משתמש, לחצו על השם שלכם למעלה ואז על \"יציאה\"."],
  [/פרסומ/, "בגרסה החינמית יש מקומות לפרסומות. אלה דוגמאות בלבד. ב-Premium הם לא מוצגים."],
  [/לילה|יום|כהה|בהיר|מצב/, "הכפתור בפינה העליונה מחליף בין מצב לילה למצב יום, והבחירה נשמרת."],
  [/השוואה|להשוות/, "בחלון \"השוואה\" בוחרים שני מודלים ורואים אותם זה לצד זה: מחיר, במה כל אחד טוב ובמה פחות."],
  [/מתי|עדכון|נבדק|אמיתי|מדויק/, "המחירים נבדקו ב-4 וב-7 בנובמבר 2026 מדפי התמחור הרשמיים. כמה מחירים נלקחו מאתרי השוואה, וזה כתוב בחלון המחירים. האתר לא מתעדכן לבד, ולכן בדקו באתר הרשמי לפני קנייה."]
];
var BOT_SUGGEST = ["כמה זה עולה?", "איך עובד מחשבון הטוקנים?", "מה יש ב-Premium?", "איך מוסיפים סקיל?"];
function botAnswer(q) {
  for (var i = 0; i < BOT_RULES.length; i++) if (BOT_RULES[i][0].test(q.toLowerCase())) return BOT_RULES[i][1];
  return "אני עונה רק על שאלות על האתר: מחירים, טוקנים, סקילים, שדרוג וחשבון. נסו לשאול למשל \"כמה זה עולה?\".";
}
function renderBot() {
  var dock = $("botDock");
  if (!user) { dock.innerHTML = ""; return; }
  if (!botOpen) { dock.innerHTML = '<button class="botbtn" id="botOpen" type="button">' + CHAT + "שאלות על האתר</button>"; return; }
  dock.innerHTML = '<section class="bot" role="dialog" aria-label="בוט שאלות על האתר"><header><span>שאלות על האתר</span><button class="x" id="botClose" type="button" aria-label="סגירה">×</button></header>' +
    '<div class="msgs" id="msgs"><div class="m">שלום ' + esc(user.name) + '. אני עונה על שאלות על האתר. אני בוט פשוט שרץ בדפדפן ואינו מודל שפה, ולכן אני מכיר רק את הנושאים של האתר.</div></div>' +
    '<div class="qs">' + BOT_SUGGEST.map(function (s) { return '<button type="button" data-q="' + s + '">' + s + "</button>"; }).join("") + "</div>" +
    '<form id="botForm"><input class="field" id="botQ" autocomplete="off" placeholder="כתבו שאלה" aria-label="שאלה"><button class="btn" type="submit" style="margin:0">שלח</button></form></section>';
  $("botQ").focus({ preventScroll: true });
}
function toggleBot(v) { botOpen = v; renderBot(); }
function botSend(q) {
  q = q.trim(); if (!q) return;
  var box = $("msgs");
  var add = function (t, me) { var d = document.createElement("div"); d.className = "m" + (me ? " me" : ""); d.textContent = t; box.appendChild(d); box.scrollTop = box.scrollHeight; };
  add(q, true);
  if (!isPro() && botCount >= 5) { add("הגעתם ל-5 שאלות בביקור הזה. ב-Premium אין הגבלה.", false); return; }
  botCount++;
  add(botAnswer(q), false);
}
$("botDock").addEventListener("click", function (e) {
  if (e.target.closest("#botOpen")) toggleBot(true);
  else if (e.target.closest("#botClose")) toggleBot(false);
  else { var s = e.target.closest("[data-q]"); if (s) botSend(s.dataset.q); }
});
$("botDock").addEventListener("submit", function (e) { e.preventDefault(); var i = $("botQ"); botSend(i.value); i.value = ""; });

/* ---------- login gate ---------- */
function showGate() {
  var g = document.createElement("div");
  g.className = "gate"; g.id = "gate";
  g.innerHTML = '<form class="box" id="gateForm"><h1>כניסה</h1><p>כדי להשתמש באתר צריך חשבון. החשבון נשמר רק בדפדפן הזה, בלי סיסמה ובלי שרת.</p>' +
    '<div class="form" style="max-width:none"><label>שם<input class="field" id="gName" required autocomplete="name"></label><label>אימייל<input class="field" id="gMail" type="email" required autocomplete="email" dir="ltr"></label><button class="btn" type="submit" style="margin:0">כניסה</button></div></form>';
  document.body.appendChild(g);
  $("gName").focus();
  $("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    user = { name: $("gName").value.trim(), email: $("gMail").value.trim(), premium: false, use: "כתיבה", budget: 10 };
    save(USER_KEY, user); g.remove(); paintBar(); renderHome(); renderBot();
  });
}

/* ---------- start ---------- */
(function () {
  var t = load(THEME_KEY); if (t) document.documentElement.setAttribute("data-theme", t);
  user = load(USER_KEY);
  paintBar(); renderHome(); renderBot();
  if (!user) showGate();
})();
</script>
</body>
</html>
